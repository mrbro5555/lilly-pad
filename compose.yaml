services:
  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./configs/mediarr/jellyfin:/config
      - ./data:/data
    ports:
      - 8096:8096
    labels:
      - tsdproxy.enable=true
    restart: unless-stopped

