services:
  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./configs/mediarr/jellyfin:/config
      - ./data:/data
    ports:
      - 8096:8096
    labels:
      - tsdproxy.enable=true
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    hostname: jellyseerr
    user: 1000:1000
    environment:
      - TZ=TIME_ZONE
    ports:
      - 5055:5055
    volumes:
      - ./configs/mediarr/jellyseerr:/app/config
    labels:
      - tsdproxy.enable=true
    restart: unless-stopped
    depends_on:
      - sonarr
      - radarr

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - puid=1000
      - pgid=1000
      - tz=africa/casablanca
    volumes:
      - ./configs/mediarr/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    depends_on:
      - flaresolverr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=TIME_ZONE
    volumes:
      - ./configs/mediarr/radarr:/config
      - ./data:/data
    ports:
      - 7878:7878
    restart: unless-stopped
    depends_on:
      - prowlarr
      - qbittorrent
      - jellyfin

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=TIME_ZONE
    volumes:
      - ./configs/mediarr/sonarr:/config
      - ./data:/data
    depends_on:
      - prowlarr
      - qbittorrent
      - jellyfin
    ports:
      - 8989:8989
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=TIME_ZONE
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=TIME_ZONE
      - WEBUI_PORT=8080
      - TORRENTING_PORT=${VPN_PORT}
    volumes:
      - ./configs/mediarr/qbittorrent:/config
      - ./data:/data
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # - 9696:9696 # Prowlarr Web UI
      # - 7878:7878 # Radarr Web UI
      # - 8989:8989 # Sonarr Web UI
      - 8080:8080 # QBittorrent Web UI
    volumes:
      - ./configs/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PUBLIC_KEY=${VPN_PUBLIC_KEY}
      - WIREGUARD_PRIVATE_KEY=${VPN_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${VPN_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${VPN_ADDRESSES}
      - SERVER_COUNTRIES=Switzerland
      - FIREWALL_VPN_INPUT_PORTS=${VPN_PORT}
      - TZ=${TIME_ZONE}

  tsdproxy:
    image: almeidapaulopt/tsdproxy:2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/tsdproxy/data:/data
      - ./configs/tsdproxy/config:/config
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
    ports:
      - "8888:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  autobrr:
    container_name: autobrr
    image: ghcr.io/autobrr/autobrr:latest
    restart: unless-stopped
    #logging:
    #  driver: json-file
    #  options:
    #    max-file: ${DOCKERLOGGING_MAXFILE}
    #    max-size: ${DOCKERLOGGING_MAXSIZE}
    user: 1000:1000
    environment:
      - TZ=${TIME_ZONE}
    volumes:
      - ./configs/mediarr/autobrr:/config
    ports:
      - 7474:7474
